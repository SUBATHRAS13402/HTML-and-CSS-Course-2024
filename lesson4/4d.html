<!...Bootstrap>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Button</title>
  <style>
    .Get_Started-button{
      background-color: rgb(121,82,179);
      color: white;
      margin-right: 20px;
      margin-left: 20px;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 16px;
      padding-right: 16px;
      border-color:rgb(108,117,125) ;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s,
      color 0.15s;
    }
    .Get_Started-button:hover{
      background-color:rgb(92, 38, 173) ;
  
    }
    .Download-button{
      background-color:none ;
      color:rgb(108,117,125);
      margin-right: 20px;
      margin-left: 20px;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 16px;
      padding-right: 16px;
      border-color:rgb(108,117,125) ;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s,
        color 0.15s;
    }
    .Download-button:hover{
      background-color:rgb(121,82,179);
      color: white;
    }
  </style>
</head>
<body>
  <button class="Get_Started-button">
    Get Started
  </button>
  
  <button class="Download-button">
    Download
  </button>  
</body>
</html>
